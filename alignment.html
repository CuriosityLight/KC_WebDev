<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>alignment notes</title>
        <meta charset="UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color:rgb(255, 248, 114);
                text-align: center;
            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 2fr 1fr 100px;
                gap: 5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                align-items: center;
                flex-wrap: wrap;
            }
            button{
                margin-top: 25px;
                padding: 50px;
            }
        </style>
    </head>
    <body>
        <h1>alignment notes</h1>
        <div id="grid-wrapper">
            <div id="box">
                <p>box1</p>
            </div>
            <div id="box">
                <p>box2</p>
            </div>
            <div id="box">
                <p>box3</p>
            </div>
            <div id="box">
                <p>box4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>box5</p>
            </div>
            <div id="box">
                <p>box6</p>
            </div>
            <div id="box">
                <p>box7</p>
            </div>
            <div id="box">
                <p>box8</p>
            </div>
        </div>
        <button>click me now...</button>
    </body>


</html>
