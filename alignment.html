<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>alignment notes</title>
        <meta charset="UTF-8">
        <style>
            #box{
                height: 75px;
                width: 75px;
                background-color:rgb(255, 248, 114);
                text-align: center;
            }
            #grid-wrapper{
                display: grid;
                grid-template-columns: 2fr 1fr 100px;
                gap: 5px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: space-evenly;
                align-items: center;
                flex-wrap: wrap;
            }
            button{
                margin-top: 25px;
                padding: 50px;
            }
            img{
                width: 200px;
            }
        </style>
    </head>
    <body>
        <h1>alignment notes</h1>
        <img src="https://images.immediate.co.uk/production/volatile/sites/30/2025/03/Bunch-of-bananas-00871a2.jpg?quality=90&resize=440,400" alt="banana" id="banana" onmouseout="rotate()">
        <div id="grid-wrapper">
            <div id="box" onmousewheel="ShowHide()">
                <p id="text">show more</p>
            </div>
            <div id="box">
                <p>box2</p>
            </div>
            <div id="box">
                <p>box3</p>
            </div>
            <div id="box">
                <p>box4</p>
            </div>
        </div>
        <div id="flex-wrapper">
            <div id="box">
                <p>box5</p>
            </div>
            <div id="box">
                <p>box6</p>
            </div>
            <div id="box">
                <p>box7</p>
            </div>
            <div id="box">
                <p>box8</p>
            </div>
        </div>
        <input type="color" id="newColor">
        <br>
        <button onclick="changeColor()">click me now...</button>
        <script>
            let images = ["https://cdn.mos.cms.futurecdn.net/v2/t:0,l:0,cw:2117,ch:1191,q:80,w:2117/YDFk8cgmSKu8VYFVedUQ8j.jpg", "https://media.istockphoto.com/id/1291262112/photo/banana.jpg?s=612x612&w=0&k=20&c=Na8FBcsTuhCRyuWLmbCV1FwOkvWLWFeVfQT-pd6tXk8=", "https://cdn.mos.cms.futurecdn.net/kzMYKaqQhtY2EzL7GABdah.jpg", "https://images.immediate.co.uk/production/volatile/sites/30/2025/03/Bunch-of-bananas-00871a2.jpg?quality=90&resize=440,400"]
            let currentimage = 0
            function rotate(){
                currentimage += 1
                document.getElementById("banana").src = images[currentimage]
                if (currentimage >3){
                    currentimage = 0
                }
            }
            function changeColor(){
                let currentColor = document.getElementById("newColor").value
                document.getElementById("box").style.backgroundColor = currentColor
            }
            function ShowHide(){
                let item = document.getElementById("flex-wrapper")
                if(item.style.display == "flex"){
                    item.style.display = "none"
                    document.getElementById("text").innerHTML = "show more"
                }else{
                    item.style.display = "flex"
                    document.getElementById("text").innerHTML = "show less"
                }
            }
            
        </script>
    </body>
</html>
