<!DOCTYPE html>
<html lang="en">
    <head>
        <title>color box</title>
        <meta charset="UTF-8">
        <style>
            .box3{
                width: 100px;
                height: 100px;
                border: solid 10px cyan;
                background-color: yellow;
                border-radius: 5px;
                color: magenta;
                font-family: "comic sans MS", "comic sans", cursive;
                
            }
            .box2{
                width: 100px;
                height: 100px;
                border: solid 10px yellow;
                background-color: red;
                border-radius: 5px;
                color: orange;
                font-family: "comic sans MS", "comic sans", cursive;
            }
            .box1{
                width: 100px;
                height: 100px;
                border: solid 10px red;
                background-color: green;
                border-radius: 5px;
                color: red;
                font-family: "comic sans MS", "comic sans", cursive;
            }
        </style>
    </head>
    <body>
        <div class="box1">
            <p>hi</p>
        </div>
        <div class="box2">
            <p>hi</p>
        </div>
        <div class="box3">
            <p>hi</p>
        </div>
    </body>
</html>
